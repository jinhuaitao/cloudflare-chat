name = "cloudflare-chat"
main = "_worker.js"
# 兼容日期决定 Worker 运行时按哪一版语义执行（nodejs_compat、fetch 重定向、缓存行为等）。
# 升级前请对照 Cloudflare 的 compatibility flags 变更说明确认无破坏性差异。
compatibility_date = "2024-09-23"

# 保留控制台里手动添加的环境变量，避免每次部署被配置文件同步清空
keep_vars = true

# ============================================================
# R2 存储桶：持久化层（机器人模型选择、对话历史、Agent 记忆与开关、微信 ClawBot 凭证与游标）
# ============================================================
# 触发 Wrangler 自动置备：
# 部署时自动创建 bucket（名字以 Worker 名为前缀，如 cloudflare-chat-r2）
# 并绑定到 Worker，代码里用 env.R2 访问。
# 若自动置备未生效，去控制台 R2 页面手动创建一个 bucket，
# 然后取消下面 bucket_name 的注释并填入。
#
# v6.3.1 起彻底移除 KV。如从 v6.2 及更早版本直接升级且 KV 中有旧数据，
# 请先部署 v6.3.0 过渡一次（会自动把 KV 数据迁移到 R2），再升级到本版。
[[r2_buckets]]
binding = "R2"
# bucket_name = "cloudflare-chat-r2"

# 跨 isolate 的读改写锁与微信长轮询租约。每个逻辑锁名映射到一个 Durable Object。
[durable_objects]
bindings = [{ name = "COORDINATOR", class_name = "Coordination" }]

# 注意：必须用 new_sqlite_classes，不能用 new_classes。
# 免费计划的 Durable Object 只支持 SQLite 存储后端，用 new_classes（KV 后端）
# 部署会直接报错 [code: 10097]。本项目的 Coordination 只用 state.storage 的
# 基础 KV 接口（get/put/delete），SQLite 后端完全兼容，无需改动业务代码。
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Coordination"]

# 若你的 Worker 历史上曾用 new_classes 成功部署过（即 v1 已生效、类已按 KV 后端创建），
# 那么上面这条 v1 不能再改内容，需要换成新的迁移标签并改用新的类名（KV 后端无法原地
# 转成 SQLite）：
#   [[migrations]]
#   tag = "v2"
#   new_sqlite_classes = ["CoordinationV2"]
# 同时把 [durable_objects] 的 class_name 和 _worker.js 的导出改成 CoordinationV2。
# 首次部署（v1 从未生效）则无需理会这段，直接用上面的 v1 即可。

# ============================================================
# 定时触发器（Cron Triggers）：驱动微信 ClawBot (iLink) 后台长轮询收发消息
# ============================================================
# 微信官方 ClawBot (iLink Bot API) 采用长轮询（getupdates）拉取消息。
# 开启每分钟 Cron 触发后，Worker 会在后台自动连接 iLink 长轮询拉取新消息并回复。
[triggers]
crons = ["* * * * *"]
