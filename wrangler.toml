name = "cloudflare-chat"
main = "_worker.js"
compatibility_date = "2024-03-20"

# 保留控制台里手动添加的环境变量，避免每次部署被配置文件同步清空
keep_vars = true

# ============================================================
# R2 存储桶：持久化层（机器人模型选择、对话历史、Agent 记忆与开关）
# ============================================================
# ，触发 Wrangler 自动置备：
# 部署时自动创建 bucket（名字以 Worker 名为前缀，如 cloudflare-chat-r2）
# 并绑定到 Worker，代码里用 env.R2 访问。
# 若自动置备未生效，去控制台 R2 页面手动创建一个 bucket，
# 然后取消下面 bucket_name 的注释并填入。
#
# v6.3.1 起彻底移除 KV。如从 v6.2 及更早版本直接升级且 KV 中有旧数据，
# 请先部署 v6.3.0 过渡一次（会自动把 KV 数据迁移到 R2），再升级到本版。
[[r2_buckets]]
binding = "R2"
# bucket_name = "cloudflare-chat-r2"

# ============================================================
# 微信 ClawBot 通道（v6.7.0）：cron 每分钟轮询 iLink 收消息。
# 不用微信可删除整个 [triggers] 段，不影响其他功能。
# ============================================================
[triggers]
crons = ["*/1 * * * *"]
