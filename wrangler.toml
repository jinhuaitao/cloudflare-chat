name = "ai-assistant-pro"
main = "_worker.js"
compatibility_date = "2024-03-20"

# 在控制台 Storage & Databases -> KV -> Create 建名为 TG_KV 的命名空间，
# 把它的 Namespace ID 填到下面的 id，然后提交推送；Git 构建会自动绑定。
# binding 必须保持为 "KV"：代码读的是 env.KV（_worker.js:247、282），
# TG_KV 只是控制台的显示名。
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_TG_KV_NAMESPACE_ID"
